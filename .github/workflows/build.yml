name: build kubeadm binaries

on:
  push:
    branches:
      - 'v*'
    tags:
      - 'release-v*'
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: kubeadm binaries
    runs-on: ubuntu-latest
    container: golang:1.24.2
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Resolve Kubernetes version
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            REF="$BASE_REF"
          else
            REF="$REF_NAME"
          fi
          # Development branches and tags both look like v1.24.0, optionally prefixed with release-
          K8S_VERSION="${REF#release-}"
          if printf '%s' "$K8S_VERSION" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+'; then
            echo "resolved ref: $REF"
            echo "Kubernetes version: $K8S_VERSION"
            echo "K8S_VERSION=$K8S_VERSION" >> "$GITHUB_ENV"
          else
            echo "::error title=Invalid version::Cannot resolve a Kubernetes version from ref '$REF'; expected v1.24.0 or release-v1.24.0"
            exit 1
          fi
      - name: Clone Kubernetes
        run: |
          git clone --branch "$K8S_VERSION" --depth 1 https://github.com/kubernetes/kubernetes.git kubernetes
      - name: Patch client-go certificate validity to 100 years
        working-directory: kubernetes
        run: |
          CERT=staging/src/k8s.io/client-go/util/cert/cert.go
          echo "=== Patch: ${CERT} ==="
          echo "--- before ---"
          grep -n NotAfter "${CERT}"
          sed -i "s#duration365d \* 10#duration365d * 100#" "${CERT}"
          echo "--- after ---"
          grep -n NotAfter "${CERT}"
      - name: Patch kubeadm certificate validity to 100 years
        working-directory: kubernetes
        run: |
          CONSTANTS=cmd/kubeadm/app/constants/constants.go
          echo "=== Patch: ${CONSTANTS} ==="
          echo "--- before ---"
          grep -n CertificateValidity "${CONSTANTS}"
          sed -i "s#CACertificateValidityPeriod = time\.Hour \* 24 \* 365 \* 10#CACertificateValidityPeriod = time.Hour * 24 * 365 * 100#" "${CONSTANTS}"
          sed -i "s#\([[:space:]]\)CertificateValidityPeriod = time\.Hour \* 24 \* 365#\1CertificateValidityPeriod = time.Hour * 24 * 365 * 100#" "${CONSTANTS}"
          echo "--- after ---"
          grep -n CertificateValidity "${CONSTANTS}"
      - name: Patch kubeadm to ignore the configured certificate NotAfter
        working-directory: kubernetes
        run: |
          PKI=cmd/kubeadm/app/util/pkiutil/pki_helpers.go
          echo "=== Patch: ${PKI} ==="
          echo "--- before ---"
          grep -n "notAfter = cfg.NotAfter" "${PKI}"
          sed -i "s#notAfter = cfg.NotAfter#//notAfter = cfg.NotAfter#" "${PKI}"
          echo "--- after ---"
          grep -n "notAfter = cfg.NotAfter" "${PKI}"
      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install -y rsync
      - name: Build
        working-directory: kubernetes
        env:
          KUBE_BUILD_PLATFORMS: "linux/amd64 linux/arm64 linux/ppc64le linux/s390x"
        run: make all WHAT=cmd/kubeadm
      - name: List Binaries
        run: find kubernetes/_output/local/bin
      - name: Upload binaries
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: kubeadm-${{ env.K8S_VERSION }}-binaries
          path: |
            kubernetes/_output/local/bin/linux/s390x/kubeadm
            kubernetes/_output/local/bin/linux/ppc64le/kubeadm
            kubernetes/_output/local/bin/linux/arm64/kubeadm
            kubernetes/_output/local/bin/linux/amd64/kubeadm
      - name: Extract stable version
        if: github.ref_type == 'tag'
        id: extract
        run: |
          if echo "$K8S_VERSION" | grep -qE '-(alpha|beta|rc)'; then
            IS_STABLE=false
          else
            IS_STABLE=true
          fi
          echo "IS_STABLE=$IS_STABLE"
          echo "IS_STABLE=$IS_STABLE" >> ${GITHUB_ENV}
          echo "IS_STABLE=$IS_STABLE" >> ${GITHUB_OUTPUT}
      - name: Stage release assets
        if: github.ref_type == 'tag'
        run: |
          mkdir -p release
          cp kubernetes/_output/local/bin/linux/amd64/kubeadm   release/kubeadm-amd64
          cp kubernetes/_output/local/bin/linux/arm64/kubeadm   release/kubeadm-arm64
          cp kubernetes/_output/local/bin/linux/ppc64le/kubeadm release/kubeadm-ppc64le
          cp kubernetes/_output/local/bin/linux/s390x/kubeadm   release/kubeadm-s390x
          find release -type f -exec sha256sum {} +
      - name: Generate release body
        if: github.ref_type == 'tag'
        env:
          BASE_URL: https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}
        run: |
          cat > release-body.md <<'BODYEOF'
          kubeadm binaries built from [kubernetes/kubernetes `${{ env.K8S_VERSION }}`](https://github.com/kubernetes/kubernetes/tree/${{ env.K8S_VERSION }}).

          ## Artifacts

          | Platform        | File                                                       |
          |-----------------|------------------------------------------------------------|
          | `linux/amd64`   | [`kubeadm-amd64`](${{ env.BASE_URL }}/kubeadm-amd64)       |
          | `linux/arm64`   | [`kubeadm-arm64`](${{ env.BASE_URL }}/kubeadm-arm64)       |
          | `linux/ppc64le` | [`kubeadm-ppc64le`](${{ env.BASE_URL }}/kubeadm-ppc64le)   |
          | `linux/s390x`   | [`kubeadm-s390x`](${{ env.BASE_URL }}/kubeadm-s390x)       |

          ## Installing

          ```shell
          # Replace amd64 with arm64, ppc64le or s390x as needed
          curl -LO ${{ env.BASE_URL }}/kubeadm-amd64
          chmod +x kubeadm-amd64
          sudo install -m 0755 kubeadm-amd64 /usr/local/bin/kubeadm
          kubeadm version
          ```
          BODYEOF
          cat release-body.md
      - name: Create release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda # v3.0.0
        with:
          name: ${{ github.ref_name }}
          body_path: release-body.md
          prerelease: ${{ env.IS_STABLE == 'false' }}
          make_latest: ${{ env.IS_STABLE == 'true' && 'legacy' || 'false' }}
          files: |
            release/**
